[build]
  command = "vite build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Route /api/* to Netlify Functions
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/summarize"
  to = "/.netlify/functions/summarize"
  status = 200

# SPA fallback — all other paths serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
